name: library_portfolio

services:
  web:
    build: .
    container_name: django_library_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgres://postgres:postgres@db:5432/library_db
    depends_on:
      - db
    # migrate を自動実行してから開発サーバーを起動
    command: >
      sh -c "uv run python library/manage.py migrate &&
             uv run python library/manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:16-alpine
    container_name: postgres_library_db
    environment:
      - POSTGRES_DB=library_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # DBデータの永続化

# DBデータを永続的に保存する名前付きボリューム
volumes:
  postgres_data:
