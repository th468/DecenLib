name: Django CI & Quality Check

# 1. ワークフローを実行するトリガーの設定
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 2. 実行するジョブの定義
jobs:
  test-and-quality:
    runs-on: ubuntu-latest

    steps:
    # ステップ 1: リポジトリのソースコードを取得
    - name: Checkout code
      uses: actions/checkout@v5

    # ステップ 2: uv (高速パッケージマネージャー) のセットアップ
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # ステップ 3: Python 3.12 環境のセットアップ
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # ステップ 4: uv による依存関係の高速インストール
    - name: Install dependencies
      run: uv sync

    # ステップ 5: Ruff による静的解析 & フォーマットチェック
    - name: Run Ruff check
      run: uv run ruff check .

    # ステップ 6: mypy による静的型チェック
    - name: Run mypy type check
      run: uv run mypy .

    # ステップ 7: Django 単体テストの実行
    - name: Run Django tests
      env:
        SECRET_KEY: "django-insecure-dummy-key-for-ci-testing"
      run: uv run python library/manage.py test library
